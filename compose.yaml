services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_platform}
      POSTGRES_USER: ${POSTGRES_USER:-payment_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payment_platform} -d ${POSTGRES_DB:-payment_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
